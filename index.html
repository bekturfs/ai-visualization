<html lang="ru">

      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>"
    />
    <title>Starry Ride — ночной заезд</title>
    <meta
      name="description"
      content="Аркадный ночной заезд в браузере: горная дорога, неоновые следы встречных фар и звёздное небо, которое меняется по дороге. Всё считается на лету — ни одного файла ассетов."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
